name: keycloak-quickstart

services:
  keycloak:
    container_name: kcq_keycloak
    image: quay.io/keycloak/keycloak:26.7
    command: start-dev
    environment:
      # HTTP_PROXY: http://proxy:3128
      # HTTPS_PROXY: http://proxy:3128
      # NO_PROXY: 'localhost,bookshop,ldap,127.0.0.0/8'
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: 'http://localhost:8080'
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: 'true'
      KC_TRUSTSTORE_PATHS: /opt/keycloak/certs/rootCA.crt
      KC_TLS_HOSTNAME_VERIFIER: ANY
      KC_SPI_EVENTS_LISTENER__WORKFLOW_EVENT_LISTENER__STEP_RUNNER_TASK_INTERVAL: 10s
      QUARKUS_HTTP_LIMITS_MAX_HEADER_LIST_SIZE: 16384 #(default: 8192)
    ports:
      - "8080:8080"
    volumes:
      - kc_data:/opt/keycloak/data
      - ./certs:/opt/keycloak/certs
      - ./themes:/opt/keycloak/themes

  mail:
    container_name: kcq_mail
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"

  bookshop:
    container_name: kcq_bookshop
    image: ghcr.io/dasniko/keycloak-bookshop-demo:0.0.12
    command: [ "wait-for-it.sh", "keycloak:8080", "--", "/deployments/entrypoint.sh" ]
    environment:
      WAITFORIT_TIMEOUT: '120'
      AUTH_SERVER_URL: http://keycloak:8080/realms/bookshop
      AUTH_SERVER_PUBLIC_URL: http://localhost:8080/realms/bookshop
      CART_AUDIENCE: account
      PIM_AUDIENCE: account
      SHOP_CLIENT_ID: shop
      SHOP_CLIENT_SECRET: unknown
    ports:
      - "3000:3000"
      - "8081:8081"
      - "8083:8083"
    volumes:
      - ./bookshop-keycloak.json:/usr/share/nginx/html/keycloak.json

  ldap:
    container_name: kcq_ldap
    image: ghcr.io/dasniko/flintstones-ldap:latest

volumes:
  kc_data:
    name: keycloak-quickstart-data
